name: Feature request
description: Suggest an improvement, new display heuristic, or configuration option
title: "[ENHANCEMENT] "
labels: ["enhancement"]
assignees: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of what the problem or limitation is.
      placeholder: 'e.g. "I want to prevent refresh rate switching when my laptop battery is above 90%", "Switching rates on external displays causes DP audio to drop out"'
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this feature work or be configured?
      placeholder: "e.g. Add a setting to pause rate changes when battery is above 90%, or an option to ignore external display audio switches."
    validations:
      required: true

  - type: textarea
    id: hardware
    attributes:
      label: Target Hardware & Display Setup
      description: Mention relevant hardware details where this feature applies (optional).
      placeholder: "e.g. OLED panel with VRR/G-Sync, hybrid GPU/Advanced Optimus laptop, CalDigit Thunderbolt 4 dock, multi-monitor high-refresh setup"
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context, mockup screenshots, or reference Windows API links.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues and discussions to make sure this is not already proposed.
          required: true
        - label: I am using the latest version of Auto Refresh Rate and verified this feature does not already exist.
          required: true
